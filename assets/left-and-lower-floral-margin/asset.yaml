# descriptive: find it and understand it
id: left-and-lower-floral-margin
title: Left and lower floral page margin, fol. 276v
description: L-shaped page margin running down the left side and along the bottom. The left column holds blue and orange acanthus at the top and bottom with a green stem of pink carnation-like flowers, a blue flower, red and pink strawberries and green leaves between them; the bottom strip has blue and pink acanthus at both ends with an orange flower and a pink thistle between. Gold ivy leaves and tendrils on fine black stems fill the ground. Transparent, with the open interior above and to the right.
