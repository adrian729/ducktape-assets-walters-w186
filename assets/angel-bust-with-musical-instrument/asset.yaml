id: angel-bust-with-musical-instrument
title: Angel bust with a small gold instrument
description: Half-length angel turned to the right, in a mauve-pink mantle with gold highlights over a green gown, a pale green veil over the hair and a dark blue, gold-flecked wing behind. The left hand cradles a small rounded gold instrument bound with an orange strap, raised towards the mouth; the right hand is lifted beside it with the fingers at the mouth. The figure ends at the painted hem of the mantle, as much as was visible in the miniature. The background is transparent.
