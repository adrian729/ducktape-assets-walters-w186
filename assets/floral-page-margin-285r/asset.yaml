# descriptive: find it and understand it
id: floral-page-margin-285r
title: Four-sided floral page margin, fol. 285r
description: Page margin surrounding a transparent text area on all four sides. The wide right column grows from blue and orange acanthus, with a green stem of strawberry plants bearing red fruit and pink flowers; the bottom strip has a grey-blue urn of orange flowers at the centre between blue and pink acanthus; the top and left sides are thin gold ivy sprigs with blue and red buds, broken into short pieces where the text and miniature stood. Gold ivy leaves on fine black stems fill the ground throughout. Transparent inside and outside the border.
