id: green-robed-angel-with-lute
title: Green-robed angel playing a lute
description: Full-length angel standing turned to the right, in a long green gown with gold-lined cuffs and hem and a white collar, blond hair, and tall wings of blue, red and pink rising behind the head. Both hands hold a gold lute across the body, its rounded back towards the viewer and the neck pointing right, the right hand plucking the strings. The background is transparent.
