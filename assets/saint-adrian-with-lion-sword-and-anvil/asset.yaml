id: saint-adrian-with-lion-sword-and-anvil
title: Saint Adrian with sword, anvil and lion
description: A standing man facing the viewer in a blue knee-length tunic trimmed with brown fur, green hose and black shoes, under a long mantle lined with white ermine and faced in pink with gold, fastened by a red jewelled brooch; he wears a white hat with a gold brim and a red jewel. The right hand raises a grey sword, the left holds a grey anvil on a block at shoulder height. A brown lion lies at his feet facing left. The background is transparent.
