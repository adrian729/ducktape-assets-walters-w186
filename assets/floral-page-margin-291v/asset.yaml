# descriptive: find it and understand it
id: floral-page-margin-291v
title: Four-sided floral page margin, fol. 291v
description: Page margin surrounding a transparent text area on all four sides. The wide left column has blue and orange acanthus at the top and bottom, with a green stem of red and pink flowers and blue flowers with yellow centres growing from a grey-blue urn at mid-height; the bottom strip has blue and orange acanthus at both ends with pink flowers between; the top and right sides are thin gold ivy sprigs with blue and red buds, the right side broken into two pieces. Gold ivy leaves on fine black stems fill the ground throughout. Transparent inside and outside the border.
