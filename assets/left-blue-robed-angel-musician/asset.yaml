id: left-blue-robed-angel-musician
title: Blue-robed angel playing a pipe
description: Full-length angel turned to the right, kneeling or floating with the robe gathered below, in a long blue gown with gold-dotted collar, cuffs and hem over a white undercollar, blond hair, and one tall wing of red, blue and gold rising high to the left. Both hands hold a straight cream and gold pipe to the mouth, pointing down to the right. The background is transparent.
