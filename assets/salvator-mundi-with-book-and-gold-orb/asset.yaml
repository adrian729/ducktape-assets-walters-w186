id: salvator-mundi-with-book-and-gold-orb
title: Salvator Mundi with book and orb
description: Christ standing facing the viewer in a long brown robe with gold hatching and a gold hem, long brown hair and beard, and a gold rayed halo behind the head. The right hand is raised in blessing; the left holds an open book with red lettering. The bare feet rest on a gold orb banded in green at the bottom. The background is transparent.
