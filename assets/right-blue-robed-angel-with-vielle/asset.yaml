id: right-blue-robed-angel-with-vielle
title: Blue-robed angel bowing a vielle
description: Full-length angel standing with the head bowed to the left, in a long teal-blue gown with gold highlights, cuffs and hem and a white collar, blond hair, and wings of red, green and blue spread above the shoulders. The left hand holds a flat gold vielle (a medieval fiddle) with a round sound hole against the chest, its neck pointing up to the right, while the right hand draws a long bow across the strings. The background is transparent.
