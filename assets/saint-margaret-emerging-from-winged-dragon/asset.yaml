# descriptive: find it and understand it
id: saint-margaret-emerging-from-winged-dragon
title: Saint Margaret rising from the dragon
description: A haloed woman with long blond hair, in a blue mantle over a gold brocade gown, rises from the back of a pale yellow-green dragon and holds a gold cross-staff in her right hand. The dragon faces left with open jaws clutching the hem of her blue mantle, ribbed green wings, clawed feet and a curling tail at the right. Below, a low grey crenellated wall runs in from both sides over green grass with small white and red flowers. The wall is cut straight along the bottom and both outer edges; the background is transparent.
