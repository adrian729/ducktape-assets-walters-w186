id: angel-bust-with-trumpets-behind
title: Angel bust with trumpets behind
description: Half-length angel in a green gown with a white collar, blond hair, the head turned slightly to the left and both hands joined in prayer at the chest; pinkish, gold-streaked wings rise behind the shoulders. Two red and gold trumpets stand up behind the figure, one long and leaning to the upper left, the other a short bell at the upper right; neither is held by this figure's hands. The lower body is cut flat across the chest where it was hidden in the source. The background is transparent.
