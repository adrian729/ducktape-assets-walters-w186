id: right-blue-robed-angel-with-harp
title: Blue-robed angel playing a harp
description: Full-length angel turned to the left, in a long blue gown with gold-dotted collar and hem over a white undercollar, blond hair, and two tall narrow wings of grey-green, blue, red and gold rising high above the head. A gold harp with a curved neck stands in front of the figure and is plucked with both hands. The robe gathers below as if kneeling or floating. The background is transparent.
